<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>My Cyprus Walk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
  <style>
    *{ -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
    a-loading-screen{ display:none !important; } /* убираем голубой экран/точки */

    /* mute/unmute — левый верх */
    #mute{
      position:fixed; left:12px; top:12px; padding:10px; border:0; border-radius:10px;
      background:#111; color:#fff; font:20px/1 system-ui; box-shadow:0 4px 16px rgba(0,0,0,.2);
      z-index:30; cursor:pointer;
    }

    /* координаты (отладка) */
    #hud{
      position:fixed; left:10px; bottom:10px; background:rgba(0,0,0,.6); color:#fff;
      font:12px system-ui; padding:6px 8px; border-radius:8px; z-index:20; pointer-events:none;
    }

    /* джойстики (только мобильные) */
    .joy{ position:fixed; bottom:18px; width:160px; height:160px; z-index:25; touch-action:none; opacity:.95; display:none; }
    #joy-move{ left:18px; }  #joy-rot{ right:18px; }
    .joy::before{ content:''; position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.15), rgba(0,0,0,.2));
      box-shadow:0 8px 28px rgba(0,0,0,.25); }

    /* радар — правый верх; размер задаём из JS */
    #radar{ position:fixed; right:12px; top:12px; z-index:26; pointer-events:none; }
    #radar canvas{ width:100%; height:100%; display:block; }

    /* крошки «хвоста» */
    .dot{ mix-blend-mode: screen; }
  </style>
</head>
<body>
<a-scene renderer="colorManagement:true" loading-screen="enabled:false" device-orientation-permission-ui="enabled:true">

  <!-- ассеты -->
  <a-assets>
    <img id="skyTex" src="assets/images/sky.jpg" crossorigin="anonymous">
    <a-asset-item id="street" src="assets/models/Limasol_Street%20(2).glb"></a-asset-item>

    <!-- ВАЖНО: mp4 H.264 + AAC, playsinline + muted для iOS -->
    <video id="clip1" src="assets/video/clip1.mp4" preload="metadata"
           playsinline webkit-playsinline muted crossorigin="anonymous"></video>
  </a-assets>

  <!-- небо -->
  <a-sky src="#skyTex" rotation="0 -90 0"></a-sky>

  <!-- свет -->
  <a-entity light="type: ambient; intensity: 0.35"></a-entity>
  <a-entity light="type: directional; intensity: 0.7" position="2 4 2"></a-entity>

  <!-- RIG + камера -->
  <a-entity id="rig">
    <a-entity id="player" camera="near:0.01; far:1000"
              look-controls="touchEnabled:false; mouseEnabled:true"
              position="0 1.6 0"></a-entity>
  </a-entity>

  <!-- модель улицы -->
  <a-entity gltf-model="#street" position="0 0 0"></a-entity>

  <!-- триггер(ы) поп-апа -->
  <a-entity class="trigger"
            position="6.088 0.0 1.772"
            popup-video="radius:2.0; video:#clip1; width:1.2; height:0.68; front:1.0; elev:0.45; right:0.0; loops:3; hysteresis:0.10">
  </a-entity>

  <!-- ПОПАП: a-video + подложка-рамка (отдельными объектами) -->
  <a-entity id="videoGroup" visible="false">
    <a-video id="videoBoard" src="#clip1" width="1.2" height="0.68"
             material="shader:flat; side:double; depthTest:false; depthWrite:false; transparent:true; opacity:1"></a-video>
    <!-- тонкая рамка позади, чтобы контраст был выше -->
    <a-plane id="videoFrame" width="1.25" height="0.73" position="0 0 -0.01"
             material="color:#000; shader:flat; depthTest:false; depthWrite:false; opacity:0.7; transparent:true"></a-plane>
  </a-entity>
</a-scene>

<!-- фоновая музыка -->
<audio id="amb" src="assets/audio/Analog_Mannequin%20Milk%20Cassette%20X.mp3%20-%20Demo.mp3" preload="auto" loop></audio>

<!-- UI -->
<button id="mute" aria-label="Toggle sound">🔇</button>
<div id="joy-move" class="joy"></div>
<div id="joy-rot"  class="joy"></div>
<div id="hud">x:0 y:0 z:0</div>
<div id="radar"><canvas id="radarCanvas"></canvas></div>

<script>
/* ===== Звук: mute/unmute без перезапуска ===== */
const amb = document.getElementById('amb');
const muteBtn = document.getElementById('mute');
let audioStarted = false;
function ensurePlayOnce(){ if (audioStarted) return; audioStarted = true; amb.muted = true; amb.play().catch(()=>{}); }
function updateMuteIcon(){ muteBtn.textContent = amb.muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', ()=>{
  ensurePlayOnce(); amb.muted = !amb.muted; updateMuteIcon();
  document.querySelectorAll('video').forEach(v=>v.muted = amb.muted); // синхронизируем с видео
});
['click','touchstart'].forEach(ev=>window.addEventListener(ev, ensurePlayOnce));
updateMuteIcon();

/* ===== базовые ссылки ===== */
const rig = document.getElementById('rig');
const camEl = document.getElementById('player');
const videoEl = document.getElementById('clip1');
const videoGroup = document.getElementById('videoGroup');
const videoBoard = document.getElementById('videoBoard');

/* ===== HUD ===== */
const hud = document.getElementById('hud');
function fmt(n){return Number(n).toFixed(3)}
setInterval(()=>{
  const p = camEl.object3D.getWorldPosition(new THREE.Vector3());
  hud.textContent = `x:${fmt(p.x)}  y:${fmt(p.y)}  z:${fmt(p.z)}`;
}, 200);

/* ===== детектор мобайла ===== */
const isTouch = AFRAME.utils.device.isMobile() ||
                navigator.maxTouchPoints > 0 ||
                window.matchMedia('(pointer: coarse)').matches;

/* ===== Desktop: WASD двигает КАМЕРУ по взгляду ===== */
if (!isTouch){
  camEl.setAttribute('wasd-controls','acceleration: 40');
} else {
  camEl.setAttribute('look-controls','touchEnabled:false; mouseEnabled:false');
}

/* ===== Мобайл: стики без инверсии. Левый — движение по взгляду камеры; Правый — yaw + pitch ===== */
let moveActive=false, rotActive=false, moveVec={x:0,y:0}, rotVec={x:0,y:0};
if (isTouch){
  const jmWrap = document.getElementById('joy-move');
  const jrWrap = document.getElementById('joy-rot');
  jmWrap.style.display='block'; jrWrap.style.display='block';

  const jm = nipplejs.create({ zone: jmWrap, mode:'static', size:130,
    position:{left:'50%', top:'50%'}, color:'white', restOpacity:0.85 });
  jm.on('move', (_, d)=>{ if(!d||!d.vector) return; moveActive=true; moveVec.x=d.vector.x; moveVec.y=d.vector.y; });
  jm.on('end', ()=>{ moveActive=false; moveVec.x=0; moveVec.y=0; });

  const jr = nipplejs.create({ zone: jrWrap, mode:'static', size:130,
    position:{left:'50%', top:'50%'}, color:'white', restOpacity:0.85 });
  jr.on('move', (_, d)=>{ if(!d||!d.vector) return; rotActive=true; rotVec.x=d.vector.x; rotVec.y=d.vector.y; });
  jr.on('end', ()=>{ rotActive=false; rotVec.x=0; rotVec.y=0; });

  AFRAME.registerComponent('mobile-camera-control',{
    schema:{ moveSpeed:{default:1.8}, rotSpeed:{default:1.8} },
    tick: function(t, dt){
      const sec = Math.min(0.05, dt/1000);
      const lc = camEl.components['look-controls'];
      if (!lc) return;

      // вращение камеры (правый стик): yaw и pitch как на геймпаде
      if (rotActive){
        const yawObj = lc.yawObject, pitchObj = lc.pitchObject;
        yawObj.rotation.y -= rotVec.x * this.data.rotSpeed * sec; // вправо — вправо
        pitchObj.rotation.x -= rotVec.y * this.data.rotSpeed * sec; // вверх — вверх
        const lim = Math.PI/2 - 0.01;
        pitchObj.rotation.x = Math.max(-lim, Math.min(lim, pitchObj.rotation.x));
      }

      // движение по земле (левый стик) относительно направления камеры
      if (moveActive){
        const fwd = new THREE.Vector3(); camEl.object3D.getWorldDirection(fwd);
        fwd.y = 0; fwd.normalize(); if (fwd.lengthSq()<1e-6) fwd.set(0,0,-1);
        const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
        const speed = this.data.moveSpeed * sec;
        const dX = right.x * moveVec.x * speed + fwd.x * moveVec.y * speed;
        const dZ = right.z * moveVec.x * speed + fwd.z * moveVec.y * speed;
        rig.object3D.position.x += dX;
        rig.object3D.position.z += dZ;
      }
    }
  });
  camEl.setAttribute('mobile-camera-control','moveSpeed:1.8; rotSpeed:1.8');
}

/* ===== кто движется для триггеров/хвоста ===== */
const moverEl = isTouch ? rig : camEl;

/* ===== ПОП-АП (a-video): в мире, «у ног», виден гарантированно ===== */
AFRAME.registerComponent('popup-video',{
  schema:{
    radius:{type:'number', default:2.0},
    video:{type:'selector'},
    width:{type:'number', default:1.2},
    height:{type:'number', default:0.68},
    front:{type:'number', default:1.0},   // вперёд от игрока
    elev:{type:'number', default:0.45},   // высота над землёй
    right:{type:'number', default:0.0},
    loops:{type:'number', default:3},
    hysteresis:{type:'number', default:0.10}
  },
  init(){
    this.active=false; this.waitExit=false; this.looped=0;
    this.video = this.data.video || videoEl;
    // подстрахуем обновление текстуры при готовности кадров
    this.video.addEventListener('loadeddata', ()=>{
      const mesh = videoBoard.getObject3D('mesh');
      if (mesh && mesh.material && mesh.material.map){ mesh.material.map.needsUpdate = true; }
    });
    // кнопка P — форс показать (диагностика)
    window.addEventListener('keydown', (e)=>{ if (e.key.toLowerCase() === 'p'){ this.show(true); }});
  },
  tick(){
    const mPos = moverEl.object3D.getWorldPosition(new THREE.Vector3());
    const tPos = this.el.object3D.getWorldPosition(new THREE.Vector3());
    const distXZ = Math.hypot(mPos.x - tPos.x, mPos.z - tPos.z);

    if (this.waitExit && distXZ > (this.data.radius + this.data.hysteresis)) this.waitExit = false;
    if (!this.active && !this.waitExit && distXZ <= this.data.radius) this.show(false);

    if (!this.active) return;

    // держим панель «у ног»: чуть впереди и немного выше земли, лицом к камере
    const cam = camEl.object3D;
    const camPos = cam.getWorldPosition(new THREE.Vector3());
    const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); if(fwd.lengthSq()<1e-6) fwd.set(0,0,-1);
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
    const groundY = camPos.y - 1.6; // рост 1.6
    const pos = new THREE.Vector3()
      .set(mPos.x, groundY + this.data.elev, mPos.z)
      .addScaledVector(fwd,  this.data.front)
      .addScaledVector(right, this.data.right);

    videoGroup.object3D.position.copy(pos);
    const yaw = Math.atan2(camPos.x - pos.x, camPos.z - pos.z);
    videoGroup.object3D.rotation.set(0, yaw, 0);

    // на всякий — просим обновить текстуру кадра
    const mesh = videoBoard.getObject3D('mesh');
    if (mesh && mesh.material && mesh.material.map){ mesh.material.map.needsUpdate = true; }
  },
  show(force){
    this.active = true; this.looped = 0;
    videoGroup.setAttribute('visible', true);
    // синхрон mute со «сценовым» аудио
    this.video.muted = amb.muted;
    this.video.loop = false;
    const onEnded = ()=> {
      this.looped++;
      if (this.looped < this.data.loops) { this.video.currentTime = 0; this.video.play().catch(()=>{}); }
      else { this.hide(); this.waitExit = true; }
    };
    this._onEnded && this.video.removeEventListener('ended', this._onEnded);
    this._onEnded = onEnded;
    this.video.addEventListener('ended', onEnded);

    // запускаем воспроизведение (картинка должна появиться сразу)
    this.video.play().catch(()=>{});
  },
  hide(){
    this.video.pause();
    videoGroup.setAttribute('visible', false);
    this.active = false;
  }
});

/* ===== РАДАР: адаптивный размер (desktop крупнее) ===== */
(function(){
  const RADAR_SIZE = (!isTouch ? 200 : 110);
  const radar = document.getElementById('radar');
  const c = document.getElementById('radarCanvas');
  radar.style.width = RADAR_SIZE+'px';
  radar.style.height = RADAR_SIZE+'px';
  c.width = RADAR_SIZE; c.height = RADAR_SIZE;

  const ctx = c.getContext('2d');
  const cx = RADAR_SIZE/2, cy = RADAR_SIZE/2, R = RADAR_SIZE/2 - 2;
  const RADAR_RANGE = 25;

  function ring(r,a){ ctx.strokeStyle=`rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); }
  setInterval(()=>{
    const cam = camEl.object3D, mover = (isTouch ? rig : camEl).object3D;
    if (!cam || !mover) return;
    const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); if(fwd.lengthSq()<1e-6) fwd.set(0,0,-1);
    const right = new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
    const mPos = mover.getWorldPosition(new THREE.Vector3());
    const triggers = Array.from(document.querySelectorAll('.trigger'));

    ctx.clearRect(0,0,c.width,c.height);
    ctx.lineWidth=1; ring(R,0.25); ring(R*0.66,0.18); ring(R*0.33,0.14);
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.moveTo(cx, cy-R); ctx.lineTo(cx, cy-R+6); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2); ctx.fill();

    let nearest=null, nearestDist=Infinity, pts=[];
    triggers.forEach(t=>{
      const tp = t.object3D.getWorldPosition(new THREE.Vector3());
      const dx=tp.x-mPos.x, dz=tp.z-mPos.z;
      const lx = dx*right.x + dz*right.z, lz = dx*fwd.x + dz*fwd.z;
      const d = Math.hypot(lx,lz); pts.push({lx,lz,d});
      if(d<nearestDist){nearestDist=d; nearest=pts[pts.length-1];}
    });

    const s=(R-6)/RADAR_RANGE;
    ctx.fillStyle='#00ffa8';
    pts.forEach(p=>{ if(p.d>RADAR_RANGE) return; ctx.beginPath(); ctx.arc(cx+p.lx*s, cy-p.lz*s, 3, 0, Math.PI*2); ctx.fill(); });
    if (nearest && nearestDist<=RADAR_RANGE){
      ctx.strokeStyle='rgba(255,215,0,0.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx+nearest.lx*s, cy-nearest.lz*s, 6, 0, Math.PI*2); ctx.stroke(); ctx.lineWidth=1;
    }
  },80);
})();

/* ===== «ХВОСТ»: очень плотный, 15 с жизни, устойчив к tab switch ===== */
AFRAME.registerComponent('crumb-trail',{
  schema:{
    step:{type:'number', default:0.004},      // ещё плотнее
    radius:{type:'number', default:0.007},
    color:{type:'color',  default:'#00e0ff'},
    fadeSeconds:{type:'number', default:15},  // ровно 15 сек
    max:{type:'number', default:15000},       // переопределим ниже
    y:{type:'number', default:0.03}
  },
  init(){
    this.last=null; this.pool=[]; this.active=[]; this.tmp=new THREE.Vector3();
    this.forceReset=false;
    document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) this.forceReset = true; });
  },
  tick(){
    if (this.forceReset){ this.last=null; this.forceReset=false; }
    const pos = this.el.object3D.getWorldPosition(this.tmp);
    const here = new THREE.Vector3(pos.x, this.data.y, pos.z);
    if (!this.last){ this.last = here.clone(); this.drop(here); return; }
    if (here.distanceTo(this.last) >= this.data.step){ this.last.copy(here); this.drop(here); }
  },
  makeDot(){
    const e = document.createElement('a-entity');
    e.classList.add('dot');
    e.setAttribute('geometry', `primitive: sphere; radius: ${this.data.radius}`);
    e.setAttribute('material', `color: ${this.data.color}; shader: flat; opacity: 0.9; transparent: true`);
    this.el.sceneEl.appendChild(e);
    return e;
  },
  drop(p){
    const e = this.pool.pop() || this.makeDot();
    e.object3D.position.set(p.x, this.data.y, p.z);
    e.object3D.visible = true;
    this.active.push(e);

    const life = this.data.fadeSeconds*1000;
    setTimeout(()=>{
      if (!e.parentNode) return;
      e.setAttribute('animation__fade','property: material.opacity; to:0; dur:600; startEvents:startfade;');
      e.emit('startfade');
      setTimeout(()=>{
        e.object3D.visible=false; e.removeAttribute('animation__fade');
        const i=this.active.indexOf(e); if(i>=0) this.active.splice(i,1);
        this.pool.push(e);
      },620);
    }, life);

    if (this.active.length > this.data.max){
      const old=this.active.shift(); if(old){ old.object3D.visible=false; this.pool.push(old); }
    }
  }
});

/* лимит хвоста: desktop 30000, mobile 15000 */
const trailMax = isTouch ? 15000 : 30000;
(isTouch ? rig : camEl).setAttribute('crumb-trail', `step:0.004; radius:0.007; color:#00e0ff; fadeSeconds:15; max:${trailMax}; y:0.03`);
</script>
</body>
</html>
