<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>My Cyprus Walk</title>
  <link rel="icon" href="favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
  <style>
    *{ -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
    a-loading-screen{ display:none !important; }
    .a-dialog{ display:none !important; } /* прибиваем «левый» диалог A-Frame про гироскоп */

    #mute{
      position:fixed; left:12px; top:12px; padding:10px; border:0; border-radius:10px;
      background:#111; color:#fff; font:20px/1 system-ui; box-shadow:0 4px 16px rgba(0,0,0,.2);
      z-index:40; cursor:pointer; display:none;
    }

    #radar{ position:fixed; right:12px; top:12px; z-index:34; pointer-events:none; }
    #radar canvas{ width:100%; height:100%; display:block; }

    #popup {
      position:fixed; background:#000;
      border:1px solid rgba(255,255,255,.25); border-radius:8px;
      box-shadow:0 10px 30px rgba(0,0,0,.45);
      overflow:hidden; z-index:35; display:none;
      width:200px; aspect-ratio:1/1;
      right:12px;
      top: calc(12px + var(--radar-size,200px) + 12px);
    }
    #popup video{ width:100%; height:100%; object-fit:cover; background:#000; display:block; }

    .joy{ position:fixed; bottom:18px; width:160px; height:160px; z-index:33; touch-action:none; opacity:.95; display:none; }
    #joy-move{ left:18px; }  #joy-rot{ right:18px; }
    .joy::before{ content:''; position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.15), rgba(0,0,0,.2));
      box-shadow:0 8px 28px rgba(0,0,0,.25); }

    .dot{ mix-blend-mode: screen; }

    #hud{
      position:fixed; left:10px; bottom:10px; background:rgba(0,0,0,.6); color:#fff;
      font:12px system-ui; padding:6px 8px; border-radius:8px; z-index:20; pointer-events:none;
    }

    #boot{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:#000; color:#fff; z-index:100;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      text-align:center; flex-direction:column;
    }
    .dots{ display:flex; gap:10px; margin-bottom:16px; }
    .dot3{ width:10px; height:10px; border-radius:50%; background:#fff; opacity:.85; animation: b 1.2s infinite ease-in-out; }
    .dot3:nth-child(2){ animation-delay:.15s } .dot3:nth-child(3){ animation-delay:.30s }
    @keyframes b{ 0%,80%,100%{ transform:scale(0.4); opacity:.5 } 40%{ transform:scale(1); opacity:1 } }

    #cassette-hint{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:50; color:#fff; text-align:center; pointer-events:none;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      opacity:0.95; flex-direction:column;
      animation: hintPulse 1.8s ease-in-out infinite;
    }
    #cassette-hint .dots{ gap:8px; margin:10px auto 0; }
    #cassette-hint .dot3{ width:8px; height:8px; }
    @keyframes hintPulse{
      0%,100%{ filter:drop-shadow(0 0 0 rgba(255,200,100,.0)); opacity:0.9 }
      50%{   filter:drop-shadow(0 0 12px rgba(255,200,100,.5)); opacity:1 }
    }
    #cassette-ring{
      position:fixed; width:56px; height:56px; border:2px solid rgba(255,255,255,.9);
      border-radius:50%; box-shadow:0 0 0 1px rgba(255,255,255,.25) inset;
      z-index:51; pointer-events:none; display:none;
    }
  </style>
</head>
<body>
<div id="boot">
  <div class="dots"><span class="dot3"></span><span class="dot3"></span><span class="dot3"></span></div>
  <div class="gr">Η ανάμνηση φορτώνεται…</div>
  <div class="en">memory is loading…</div>
</div>

<div id="cassette-hint">
  <div>tap cassette to start sound</div>
  <div class="dots"><span class="dot3"></span><span class="dot3"></span><span class="dot3"></span></div>
</div>
<div id="cassette-ring"></div>

<a-scene
  renderer="colorManagement:true; physicallyCorrectLights:false; antialias:true; precision:mediump; powerPreference:high-performance"
  loading-screen="enabled:false"
  device-orientation-permission-ui="enabled:true"
  vr-mode-ui="enabled:false"
>
  <a-assets>
    <!-- небо -->
    <img id="skyTex" src="assets/images/sky.jpg" crossorigin="anonymous">
    <!-- сцена -->
    <a-asset-item id="world" src="assets/models/limassol-walk.glb"></a-asset-item>
    <a-asset-item id="moving-object" src="moving.glb"></a-asset-item>

    <!-- HUD-видео и общий мобильный видео-элемент для плейнов -->
    <video id="popupVideo" preload="metadata" playsinline webkit-playsinline crossorigin="anonymous"></video>
    <video id="planeVideoMobile" preload="metadata" playsinline webkit-playsinline muted style="display:none"></video>

    <!-- Аудио -->
    <audio id="amb"        src="assets/audio/Analog_Mannequin%20Milk%20Cassette%20X.mp3%20-%20Demo.mp3" preload="auto" crossorigin="anonymous"></audio>
    <audio id="dogAudio"   src="assets/audio/dog.mp3"   preload="auto" crossorigin="anonymous"></audio>
    <audio id="gyrosAudio" src="assets/audio/gyros.mp3" preload="auto" crossorigin="anonymous"></audio>
    <!-- отдельный звук для кошки (только мобилка) -->
    <audio id="clip1Audio" src="assets/audio/popup/clip1.mp3" preload="auto" crossorigin="anonymous"></audio>
  </a-assets>

  <a-sky src="#skyTex" rotation="0 -90 0"></a-sky>

  <a-entity light="type: ambient; intensity: 0.35"></a-entity>
  <a-entity light="type: directional; intensity: 0.7" position="2 4 2"></a-entity>

  <a-entity id="rig">
    <a-entity id="player" camera="near:0.01; far:1000"
              look-controls="touchEnabled:false; mouseEnabled:true"
              position="0 1.6 0"
              cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 50">
    </a-entity>
  </a-entity>

  <a-entity id="streetEntity" gltf-model="#world" position="0 0 0"></a-entity>
  <a-entity id="moving-car" gltf-model="#moving-object" path-movement></a-entity>
</a-scene>

<div id="popup">
  <video id="popupHud" playsinline webkit-playsinline preload="metadata"></video>
</div>

<button id="mute" aria-label="Toggle sound">🔇</button>
<div id="joy-move" class="joy"></div>
<div id="joy-rot"  class="joy"></div>
<div id="hud">x:0 y:0 z:0</div>
<div id="radar"><canvas id="radarCanvas"></canvas></div>

<script>
/* ========== утилиты/детекторы ========== */
const isTouch = AFRAME.utils.device.isMobile() || navigator.maxTouchPoints>0 || window.matchMedia('(pointer: coarse)').matches;
function isiOS(){ return /iP(hone|ad|od)/.test(navigator.platform) || (navigator.userAgent.includes('Mac') && 'ontouchend' in document); }

const muteBtn = document.getElementById('mute');
const popupWrap = document.getElementById('popup');
const popupHud  = document.getElementById('popupHud');
const planeVideoMobile = document.getElementById('planeVideoMobile');
const rig   = document.getElementById('rig');
const camEl = document.getElementById('player');
const streetEntity = document.getElementById('streetEntity');
const boot  = document.getElementById('boot');
const cassetteHint = document.getElementById('cassette-hint');
const cassetteRing = document.getElementById('cassette-ring');

function whenModelReady(cb){
  const run = () => { const root = streetEntity.getObject3D('mesh'); if (root) cb(root); };
  if (streetEntity.hasLoaded && streetEntity.getObject3D('mesh')) run();
  else streetEntity.addEventListener('model-loaded', run, {once:true});
}
function findNodeByName(root,name){
  const t=name.toLowerCase(); let f=null;
  root.traverse(n=>{ if(f) return; const nm=(n.name||'').toLowerCase(); if(nm===t || nm.startsWith(t)) f=n; });
  return f;
}

/* ========== загрузочный экран ========== */
function hideBoot(){ boot.style.display='none'; }
streetEntity.addEventListener('model-loaded', hideBoot, {once:true});
setTimeout(hideBoot, 10000);

/* ========== статус-позиция ========== */
function fmt(n){return Number(n).toFixed(3)}
setInterval(()=>{ const p = camEl.object3D.getWorldPosition(new THREE.Vector3());
  document.getElementById('hud').textContent = `x:${fmt(p.x)}  y:${fmt(p.y)}  z:${fmt(p.z)}`; }, 200);

/* ========== общий AudioContext (фон с 9 с) ========== */
let audioCtx=null, ambGain=null, ambBuffer=null, ambSource=null, ambStarted=false, ambMuted=false;
async function loadAmbBuffer(url){ const res = await fetch(url, {cache:'force-cache'}); const arr = await res.arrayBuffer();
  const ctx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx=ctx; return await ctx.decodeAudioData(arr); }
async function startBackgroundFrom9s(){
  if (ambStarted) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (!ambGain){ ambGain = audioCtx.createGain(); ambGain.gain.value = ambMuted?0:1; ambGain.connect(audioCtx.destination); }
  if (!ambBuffer) ambBuffer = await loadAmbBuffer(document.getElementById('amb').src);
  ambSource = audioCtx.createBufferSource(); ambSource.buffer = ambBuffer; ambSource.loop = true; ambSource.connect(ambGain);
  const offset = Math.min(ambBuffer.duration-0.1, 9);
  ambSource.start(0, offset);
  ambStarted = true;
}
function toggleAmbMute(){ ambMuted = !ambMuted; if (ambGain) ambGain.gain.value = ambMuted?0:1; muteBtn.textContent = ambMuted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', toggleAmbMute);

/* ========== резюмим оба контекста по первому жесту ========== */
let userMediaUnlocked=false;
function resumeSceneAudioContext(){
  try{
    const ctx = document.querySelector('a-scene')?.audioListener?.context;
    if (ctx && ctx.state !== 'running') ctx.resume().catch(()=>{});
  }catch(_){}
}
function unlockMedia(){
  if (userMediaUnlocked) return;
  userMediaUnlocked=true;
  try{ if (audioCtx && audioCtx.state!=='running') audioCtx.resume(); }catch(_){}
  resumeSceneAudioContext();
}
['touchstart','pointerdown','mousedown'].forEach(ev=>window.addEventListener(ev, unlockMedia, {passive:true}));

/* ========== iOS экономия ========== */
document.querySelector('a-scene').addEventListener('loaded', ()=>{
  if (isiOS()){
    try{ const r = document.querySelector('a-scene').renderer; r.setPixelRatio(1); r.antialias = false; }catch(_){}
  }
});

/* ========== размеры HUD (радар+попап) ========== */
const JOY_SIZE=160; const RADAR_SIZE = (!isTouch ? 400 : JOY_SIZE); const RADAR_MARGIN=12;
(function(){
  const radar=document.getElementById('radar'); const c=document.getElementById('radarCanvas');
  radar.style.width=RADAR_SIZE+'px'; radar.style.height=RADAR_SIZE+'px'; c.width=RADAR_SIZE; c.height=RADAR_SIZE;
  const popupWrapEl=document.getElementById('popup'); popupWrapEl.style.width=RADAR_SIZE+'px'; popupWrapEl.style.aspectRatio='1 / 1';
  popupWrapEl.style.top=(12+RADAR_SIZE+RADAR_MARGIN)+'px'; popupWrapEl.style.right='12px'; popupWrapEl.style.left='auto';
})();

/* ========== управление ========== */
if (!isTouch){ camEl.setAttribute('wasd-controls','acceleration: 40'); }
else { camEl.setAttribute('look-controls','touchEnabled:false; mouseEnabled:false'); }
let moveActive=false, rotActive=false, moveVec={x:0,y:0}, rotVec={x:0,y:0};
function resetSticks(){ moveActive=false; rotActive=false; moveVec.x=moveVec.y=rotVec.x=rotVec.y=0; }
window.addEventListener('blur', resetSticks);
if (isTouch){
  const jmWrap=document.getElementById('joy-move'), jrWrap=document.getElementById('joy-rot');
  jmWrap.style.display='block'; jrWrap.style.display='block';
  const jm=nipplejs.create({ zone:jmWrap, mode:'static', size:JOY_SIZE, position:{left:'50%',top:'50%'}, color:'white', restOpacity:0.85 });
  jm.on('move',(_,d)=>{ if(!d||!d.vector) return; moveActive=true; moveVec.x=d.vector.x; moveVec.y=d.vector.y; });
  jm.on('end', resetSticks);
  const jr=nipplejs.create({ zone:jrWrap, mode:'static', size:JOY_SIZE, position:{left:'50%',top:'50%'} , color:'white', restOpacity:0.85 });
  jr.on('move',(_,d)=>{ if(!d||!d.vector) return; rotActive=true; rotVec.x=d.vector.x; rotVec.y=d.vector.y; });
  jr.on('end', resetSticks);

  AFRAME.registerComponent('mobile-camera-control',{
    schema:{ moveSpeed:{default:1.9}, rotSpeed:{default:1.9} },
    tick:function(t,dt){
      const sec=Math.min(0.05, dt/1000); const lc=camEl.components['look-controls']; if(!lc) return;
      if (rotActive){
        lc.yawObject.rotation.y -= rotVec.x * this.data.rotSpeed * sec;     // ←/→
        lc.pitchObject.rotation.x += rotVec.y * this.data.rotSpeed * sec;   // ↑/↓
        const lim=Math.PI/2 - 0.01; lc.pitchObject.rotation.x=Math.max(-lim, Math.min(lim, lc.pitchObject.rotation.x));
      }
      if (moveActive){
        const fwd=new THREE.Vector3(); camEl.object3D.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); if(fwd.lengthSq()<1e-6) fwd.set(0,0,-1);
        const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
        const speed=this.data.moveSpeed*sec; const forward=-moveVec.y; const strafe=-moveVec.x;
        rig.object3D.position.x += (right.x*strafe + fwd.x*forward)*speed;
        rig.object3D.position.z += (right.z*strafe + fwd.z*forward)*speed;
      }
    }
  });
  camEl.setAttribute('mobile-camera-control','moveSpeed:1.9; rotSpeed:1.9');
}
const moverEl = isTouch ? rig : camEl;

/* ========== видео утилиты ========== */
function cleanupVideoEl(v){ if(!v) return; try{ v.pause(); }catch(_){}
  try{ v.removeAttribute('src'); v.src=''; }catch(_){}
  try{ v.load(); }catch(_){}
}
async function robustPlay(video, {tries=10, step=0.05, wait=260}={}){
  let ok=false;
  for(let i=0;i<tries;i++){
    try{ video.currentTime=Math.max(0,(video.currentTime||0)+step);}catch(_){}
    try{
      const p=video.play(); if (p) await p;
      const t0=video.currentTime; await new Promise(r=>setTimeout(r,wait)); const t1=video.currentTime;
      if (t1>t0+0.0005){ ok=true; break; }
    }catch(_){}
  }
  return ok;
}
async function chooseMobileFirst(videoEl, baseSrc){
  const mobileSrc = baseSrc.replace(/\.mp4$/i,'.mobile.mp4');
  try{
    videoEl.src = mobileSrc; videoEl.load(); videoEl.currentTime=0.05;
    const ok = await robustPlay(videoEl);
    if (ok) return mobileSrc;
  }catch(_){}
  try{
    videoEl.src = baseSrc; videoEl.load(); videoEl.currentTime=0.05;
    const ok = await robustPlay(videoEl);
    if (ok) return baseSrc;
  }catch(_){}
  return null;
}

/* ========== кассета: анимация и схлоп за 1с после тапа ========== */
AFRAME.registerComponent('cassette-setup',{
  init(){
    this.ready=false; this.cassette=null; this.t0=performance.now();
    this.shrink=false; this.shrinkStart=0; this.basePos=this.baseRot=this.baseScale=null;
    whenModelReady(root=>{
      root.traverse(n=>{ const nm=(n.name||'').toLowerCase(); if(!this.cassette && (nm==='cassette'||nm==='кассета'||nm.startsWith('cassette'))) this.cassette=n; });
      if (!this.cassette) return;
      this.basePos=this.cassette.position.clone(); this.baseRot=this.cassette.rotation.clone(); this.baseScale=this.cassette.scale.clone(); this.ready=true;

      const wp=new THREE.Vector3(); this.cassette.getWorldPosition(wp);
      const s=document.createElement('a-entity');
      s.setAttribute('position',`${wp.x} ${wp.y} ${wp.z}`);
      s.setAttribute('geometry','primitive: circle; radius: 0.6; segments: 24');
      s.setAttribute('material','color:#fff; opacity:0; transparent:true; side:double');
      s.classList.add('clickable');
      s.addEventListener('click', async ()=>{
        unlockMedia();
        try{
          await startBackgroundFrom9s(); resumeSceneAudioContext();
          document.getElementById('mute').style.display='block';
          cassetteHint.style.display='none'; cassetteRing.style.display='none';
          this.shrink=true; this.shrinkStart=performance.now();
        }catch(e){ console.log('bg play err:', e); }
      });
      this.el.sceneEl.appendChild(s);
      cassetteRing.style.display='block';
    });
  },
  tick(){
    if(!this.ready||!this.cassette) return;
    const t=(performance.now()-this.t0)/1000;
    if (!this.shrink){
      const bobAmp=0.5; const bob=Math.sin(t*Math.PI/2)*bobAmp; this.cassette.position.y=(this.basePos?.y||0)+bob;
      const yawAmp=THREE.MathUtils.degToRad(30); const yaw=Math.sin(t*0.6)*yawAmp; this.cassette.rotation.y=(this.baseRot?.y||0)+yaw;
      const cam=camEl.getObject3D('camera');
      if (cam){
        const v=new THREE.Vector3(); this.cassette.getWorldPosition(v); v.project(cam);
        const x=(v.x*0.5+0.5)*window.innerWidth; const y=(-v.y*0.5+0.5)*window.innerHeight;
        if (v.z>1) { cassetteRing.style.display='none'; }
        else { if (cassetteHint.style.display!=='none') cassetteRing.style.display='block';
          cassetteRing.style.transform=`translate(${Math.round(x-28)}px, ${Math.round(y-28)}px)`; }
      }
    } else {
      const k = Math.min(1, (performance.now()-this.shrinkStart)/1000);
      const s = Math.max(0, 1-k);
      this.cassette.scale.set(this.baseScale.x*s, this.baseScale.y*s, this.baseScale.z*s);
      if (k>=1){ this.cassette.visible=false; }
    }
  }
});
document.querySelector('a-scene').setAttribute('cassette-setup','');

/* ========== очередь медиа (iOS) ========== */
const mediaQueue = [];
let mediaBusy=false;
async function enqueueMedia(task){
  if (!isiOS()) return task(); // не iOS – сразу
  return new Promise((resolve)=>{ mediaQueue.push({task,resolve}); pumpQueue(); });
}
async function pumpQueue(){
  if (mediaBusy || mediaQueue.length===0) return;
  mediaBusy=true;
  const {task,resolve}=mediaQueue.shift();
  try{ const r = await task(); resolve(r); }
  finally{ mediaBusy=false; setTimeout(pumpQueue, 200); }
}

/* ========== HUD pop-up (мобилка без звука, но у cat — отдельная дорожка) ========== */
AFRAME.registerComponent('popup-video-hud',{
  schema:{ radius:{default:2.0}, loops:{default:1}, hysteresis:{default:0.10}, side:{default:'right'}, src:{default:'assets/video/clip1.mp4'}, audio:{default:''} },
  init(){ this.active=false; this.waitExit=false; this.looped=0; this.video=popupHud; this._onEnded=this.onEnded.bind(this); this._extAudio=null; },
  tick(){
    const m=(isTouch?rig:camEl).object3D.getWorldPosition(new THREE.Vector3());
    const t=this.el.object3D.getWorldPosition(new THREE.Vector3());
    const d=Math.hypot(m.x-t.x, m.z-t.z);
    if (this.waitExit && d>(this.data.radius+this.data.hysteresis)) this.waitExit=false;
    if (!this.active && !this.waitExit && d<=this.data.radius) this.show();
  },
  async show(){
    if (!userMediaUnlocked){ const retry=()=>{ window.removeEventListener('touchstart', retry); this.show(); }; window.addEventListener('touchstart', retry, {once:true}); return; }
    await enqueueMedia(async ()=>{
      this.cleanup(); this.active=true; this.looped=0;

      if (this.data.side==='left'){ popupWrap.style.left='12px'; popupWrap.style.right='auto'; } else { popupWrap.style.right='12px'; popupWrap.style.left='auto'; }
      popupWrap.style.display='block';

      try{
        this.video.removeEventListener('ended', this._onEnded);

        if (isTouch){
          /* Мобилка: видео БЕЗ звука */
          this.video.muted = true;
          let src = await chooseMobileFirst(this.video, this.data.src);
          if (!src){ this.hide(); return; }

          // Особый случай — кошка/clip1: отдельная аудиодорожка
          if (this.data.audio){
            try{
              const a = document.getElementById('clip1Audio');
              if (a){ a.currentTime = 0; a.play().catch(()=>{}); this._extAudio = a; }
            }catch(_){}
          }

          this.video.addEventListener('ended', this._onEnded);
          const ok = await robustPlay(this.video);
          if (!ok){ this.hide(); return; }
        } else {
          /* Десктоп: как было — со звуком внутри видео */
          this.video.muted = false;
          let src = await chooseMobileFirst(this.video, this.data.src);
          if (!src){ this.hide(); return; }
          this.video.addEventListener('ended', this._onEnded);
          const ok = await robustPlay(this.video);
          if (!ok){ this.hide(); return; }
        }
      }catch(_){ this.hide(); }
    });
  },
  onEnded(){
    this.looped++;
    if (this.looped < this.data.loops){ try{ this.video.currentTime=0.05; }catch(_){}
      robustPlay(this.video);
    } else { this.hide(); this.waitExit=true; }
  },
  hide(){
    try{ this.video.pause(); }catch(_){}
    if (this._extAudio){ try{ this._extAudio.pause(); }catch(_){}
      try{ this._extAudio.currentTime=0; }catch(_){} this._extAudio=null; }
    popupWrap.style.display='none'; this.active=false;
  },
  cleanup(){
    cleanupVideoEl(this.video); this.video.removeEventListener('ended', this._onEnded);
    if (this._extAudio){ try{ this._extAudio.pause(); }catch(_){}
      try{ this._extAudio.currentTime=0; }catch(_){} this._extAudio=null; }
  }
});

/* ========== хвост: СПРАЙТЫ (plane + look-at), лимит в 3 раза меньше ========== */
AFRAME.registerComponent('crumb-trail',{
  schema:{ step:{default:0.006}, size:{default:0.05}, color:{default:'#00e0ff'}, fadeSeconds:{default:15}, max:{default:isTouch?5000:10000}, y:{default:0.03} },
  init(){ this.last=null; this.pool=[]; this.active=[]; this.tmp=new THREE.Vector3(); this.forceReset=false;
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) this.forceReset=true; }); },
  tick(){
    if (this.forceReset){ this.last=null; this.forceReset=false; }
    const pos=this.el.object3D.getWorldPosition(this.tmp); const here=new THREE.Vector3(pos.x, this.data.y, pos.z);
    if (!this.last){ this.last=here.clone(); this.drop(here); return; }
    if (here.distanceTo(this.last) >= this.data.step){ this.last.copy(here); this.drop(here); }
  },
  makeDot(){
    const e=document.createElement('a-entity'); e.classList.add('dot');
    e.setAttribute('geometry',`primitive: plane; width:${this.data.size}; height:${this.data.size}`);
    e.setAttribute('material',`color:${this.data.color}; shader: flat; opacity:0.9; transparent:true; side:double`);
    e.setAttribute('look-at','#player');
    this.el.sceneEl.appendChild(e); return e;
  },
  drop(p){
    const e=this.pool.pop()||this.makeDot(); e.object3D.position.set(p.x, this.data.y, p.z); e.object3D.visible=true; this.active.push(e);
    const life=this.data.fadeSeconds*1000;
    setTimeout(()=>{ if(!e.parentNode) return;
      e.setAttribute('animation__fade','property: material.opacity; to:0; dur:500; startEvents:startfade;');
      e.emit('startfade'); setTimeout(()=>{ e.object3D.visible=false; e.removeAttribute('animation__fade');
        const i=this.active.indexOf(e); if(i>=0) this.active.splice(i,1); this.pool.push(e); },520);
    }, life);
    if (this.active.length>this.data.max){ const old=this.active.shift(); if(old){ old.object3D.visible=false; this.pool.push(old); } }
  }
});
(isTouch?rig:camEl).setAttribute('crumb-trail','');

/* ========== gyros (reveal+звук) ========== */
AFRAME.registerComponent('reveal-node-rot-fade',{
  schema:{ targetName:{default:''}, radius:{default:2.0}, hysteresis:{default:0.20}, spinDegPerSec:{default:60}, lifeMs:{default:15000}, fadeMs:{default:800}, soundId:{default:'gyrosAudio'} },
  init(){ this.armed=true; this.active=false; this.targetNode=null; this.spawnTime=0; this.fading=false; this.fadeStart=0; this.soundEnt=null;
    whenModelReady(root=>{
      this.targetNode=findNodeByName(root,this.data.targetName);
      if(!this.targetNode){ console.warn('Gyros node not found'); return; }
      this.targetNode.visible=false; this.targetNode.scale.setScalar(0);
      const wp=new THREE.Vector3(); this.targetNode.getWorldPosition(wp);
      const s=document.createElement('a-entity');
      s.setAttribute('position',`${wp.x} ${wp.y} ${wp.z}`);
      s.setAttribute('sound',`src:#${this.data.soundId}; positional:true; refDistance:2; maxDistance:12; rolloffFactor:1`);
      streetEntity.sceneEl.appendChild(s); this.soundEnt=s;
    });
  },
  tick(time,dt){
    if(!this.targetNode) return;
    const now=this.el.sceneEl.time;
    const m=(isTouch?rig:camEl).object3D.getWorldPosition(new THREE.Vector3());
    const t=this.el.object3D.getWorldPosition(new THREE.Vector3());
    const d=Math.hypot(m.x-t.x, m.z-t.z);

    if (this.armed && d<=this.data.radius && !this.active){
      this.active=true; this.fading=false; this.fadeStart=0; this.spawnTime=now;
      this.targetNode.visible=true; this.targetNode.scale.setScalar(1);
      resumeSceneAudioContext();
      try{ this.soundEnt?.components.sound.stopSound(); }catch(_){}
      try{ this.soundEnt?.components.sound.playSound(); }catch(_){ setTimeout(()=>this.soundEnt?.components.sound.playSound(), 140); }
    } else if (!this.armed && d>(this.data.radius+this.data.hysteresis) && !this.active){ this.armed=true; }

    if (this.active){
      const sec=Math.min(0.05, dt/1000);
      this.targetNode.rotation.y += (this.data.spinDegPerSec*Math.PI/180)*sec;
      if (!this.fading && (now - this.spawnTime) >= this.data.lifeMs){ this.fading=true; this.fadeStart=now; }
      if (this.fading){
        const t=(now - this.fadeStart)/this.data.fadeMs; const k=Math.min(1,Math.max(0,t)); const s=1-(k*k*(3-2*k));
        this.targetNode.scale.setScalar(Math.max(0,s));
        if (k>=1){ this.targetNode.visible=false; this.active=false; this.fading=false; }
      }
  } }
});

/* ========== dog (attention + позиционный звук) ========== */
AFRAME.registerComponent('attention-dog',{
  schema:{ radius:{default:1.0}, hysteresis:{default:0.20}, lifeMs:{default:6000}, fadeMs:{default:600} },
  init(){ this.armed=true; this.playing=false; this.dogNode=null; this.soundEl=null; this.spawnTime=0; this.fading=false; this.fadeStart=0;
    whenModelReady(root=>{
      this.dogNode=findNodeByName(root,'dog'); if(!this.dogNode){ console.warn('dog node not found'); return; }
      this.dogNode.visible=false; this.dogNode.scale.setScalar(0);
      const wp=new THREE.Vector3(); this.dogNode.getWorldPosition(wp);
      const s=document.createElement('a-entity');
      s.setAttribute('position',`${wp.x} ${wp.y} ${wp.z}`);
      s.setAttribute('sound','src:#dogAudio; positional:true; refDistance:2; maxDistance:12; rolloffFactor:1');
      this.soundEl=s; streetEntity.sceneEl.appendChild(s);
    });
  },
  tick(){
    if(!this.dogNode) return;
    const m=(isTouch?rig:camEl).object3D.getWorldPosition(new THREE.Vector3());
    const t=this.el.object3D.getWorldPosition(new THREE.Vector3());
    const d=Math.hypot(m.x-t.x, m.z-t.z);

    if (this.armed && d<=this.data.radius && !this.playing){ this.trigger(); this.armed=false; }
    else if (!this.armed && d>(this.data.radius+this.data.hysteresis) && !this.playing){ this.armed=true; }

    if (this.playing){
      const now=this.el.sceneEl.time;
      if (!this.fading && (now - this.spawnTime) >= this.data.lifeMs){ this.fading=true; this.fadeStart=now; }
      if (this.fading){
        const t=(now - this.fadeStart)/this.data.fadeMs; const k=Math.min(1,Math.max(0,t)); const s=1-(k*k*(3-2*k));
        this.dogNode.scale.setScalar(Math.max(0,s));
        if (k>=1){ this.dogNode.visible=false; this.playing=false; this.fading=false; }
      }
    }
  },
  trigger(){
    resumeSceneAudioContext();
    this.playing=true; this.spawnTime=this.el.sceneEl.time; this.fading=false;
    this.dogNode.visible=true; this.dogNode.scale.setScalar(1);
    try{ this.soundEl?.components.sound.stopSound(); }catch(_){}
    try{ this.soundEl?.components.sound.playSound(); }catch(_){ setTimeout(()=>this.soundEl?.components.sound.playSound(),140); }
  }
});

/* ========== Плейны: iOS — видео без звука, desktop — как было ========== */
AFRAME.registerComponent('plane-video-once',{
  schema:{ nodeName:{default:''}, videoSrc:{default:''}, radius:{default:2.5}, hysteresis:{default:0.10} },
  init(){
    this.node=null; this.ready=false; this.playing=false; this.waitExit=false;
    this.video=null; this.tex=null;
    whenModelReady(root=>{ this.node=findNodeByName(root, this.data.nodeName); if(!this.node) return; this.node.visible=false; this.ready=true; });
  },
  tick(){
    if(!this.ready||!this.node) return;
    const m=(isTouch?rig:camEl).object3D.getWorldPosition(new THREE.Vector3());
    const t=this.node.getWorldPosition(new THREE.Vector3());
    const d=Math.hypot(m.x-t.x, m.z-t.z);
    if(!this.playing && !this.waitExit && d<=this.data.radius){ this.startVideo(); }
    else if (this.waitExit && d>(this.data.radius+this.data.hysteresis)){ this.waitExit=false; }
  },
  async startVideo(){
    if (!userMediaUnlocked){ const retry=()=>{ window.removeEventListener('touchstart', retry); this.startVideo(); }; window.addEventListener('touchstart', retry, {once:true}); return; }
    await enqueueMedia(async ()=>{
      this.playing=true; this.node.visible=true;

      const makeMaterial = (tex)=>{ const m = new THREE.MeshBasicMaterial({ map:tex, side:THREE.DoubleSide }); m.toneMapped=false; return m; };

      if (isiOS()){
        this.video = planeVideoMobile; try{ this.video.pause(); }catch(_){}
        const src = await chooseMobileFirst(this.video, this.data.videoSrc);
        if (!src){ this.finish(); return; }
        const ok = await robustPlay(this.video);
        if (!ok){ this.finish(); return; }

        this.tex = new THREE.VideoTexture(this.video);
        if (THREE.SRGBColorSpace) this.tex.colorSpace = THREE.SRGBColorSpace;
        this.tex.minFilter=THREE.LinearFilter; this.tex.magFilter=THREE.LinearFilter; this.tex.needsUpdate=true;

        const mat = makeMaterial(this.tex);
        const meshes=[]; this.node.traverse(n=>{ if(n.isMesh) meshes.push(n); });
        meshes.forEach(n=>{ n.material=mat; if (n.material.map){ n.material.map.repeat.x=-1; n.material.map.offset.x=1; n.material.map.needsUpdate=true; } });

        setTimeout(()=>{ if (this.playing) this.finish(); }, 60000);
      } else {
        this.video = document.createElement('video');
        this.video.playsInline=true; this.video.preload='metadata'; this.video.crossOrigin='anonymous';
        this.video.loop=false; this.video.muted=false;

        let src = await chooseMobileFirst(this.video, this.data.videoSrc);
        if (!src){ this.finish(); return; }

        this.tex = new THREE.VideoTexture(this.video);
        if (THREE.SRGBColorSpace) this.tex.colorSpace = THREE.SRGBColorSpace;
        this.tex.minFilter=THREE.LinearFilter; this.tex.magFilter=THREE.LinearFilter; this.tex.needsUpdate=true;

        const mat = makeMaterial(this.tex);
        const meshes=[]; this.node.traverse(n=>{ if(n.isMesh) meshes.push(n); });
        meshes.forEach(n=>{ n.material=mat; if (n.material.map){ n.material.map.repeat.x=-1; n.material.map.offset.x=1; n.material.map.needsUpdate=true; } });

        this.video.addEventListener('ended', ()=>this.finish(), {once:true});
        const ok=await robustPlay(this.video); if (!ok){ this.finish(); return; }
      }
    });
  },
  finish(){
    try{ this.video?.pause(); }catch(_){}
    if (this.tex){ this.tex.dispose(); this.tex=null; }
    cleanupVideoEl(this.video);
    this.node.visible=false;
    this.playing=false; this.waitExit=true;
  }
});

/* ========== Радар (чуть легче) ========== */
(function(){
  const c=document.getElementById('radarCanvas'); const ctx=c.getContext('2d');
  const cx=c.width/2, cy=c.height/2, R=Math.min(cx,cy)-2, RADAR_RANGE=25;
  const tmpFwd=new THREE.Vector3(), tmpRight=new THREE.Vector3(), tmpPos=new THREE.Vector3(), tmpTp=new THREE.Vector3();
  function ring(r,a){ ctx.strokeStyle=`rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); }
  const INTERVAL = isTouch ? 140 : 80;
  setInterval(()=>{
    const cam=camEl.object3D, mover=(isTouch?rig:camEl).object3D; if(!cam||!mover) return;
    cam.getWorldDirection(tmpFwd); tmpFwd.y=0; tmpFwd.normalize(); if(tmpFwd.lengthSq()<1e-6) tmpFwd.set(0,0,-1);
    tmpRight.crossVectors(tmpFwd,new THREE.Vector3(0,1,0)).normalize();
    mover.getWorldPosition(tmpPos);

    const popupTrigs=document.getElementsByClassName('trigger-popup');
    const revealTrigs=document.getElementsByClassName('trigger-reveal');
    const planeTrigs=document.getElementsByClassName('trigger-plane');

    ctx.clearRect(0,0,c.width,c.height);
    ctx.lineWidth=1; ring(R,0.25); ring(R*0.66,0.18); ring(R*0.33,0.14);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,Math.max(2,R*0.02),0,Math.PI*2); ctx.fill();

    const worldNorth=new THREE.Vector3(0,0,-1);
    const nx=worldNorth.dot(tmpRight), nz=worldNorth.dot(tmpFwd);
    const rN=R-8, xN=cx - nx*rN, yN=cy + nz*rN;
    ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.font=Math.max(12,Math.floor(R*0.12))+'px system-ui,-apple-system,Segoe UI,Roboto,Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('N', xN, yN);

    const chevrLen=Math.max(12,R*0.24), chevrYOffset=Math.max(10,R*0.10);
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-chevrLen*0.5, cy - chevrYOffset + chevrLen*0.5);
    ctx.lineTo(cx,                 cy - chevrYOffset);
    ctx.lineTo(cx+chevrLen*0.5, cy - chevrYOffset + chevrLen*0.5); ctx.stroke();

    const s=(R-6)/RADAR_RANGE;
    function draw(list,color){
      ctx.fillStyle=color;
      for (let i=0;i<list.length;i++){
        const el=list[i];
        el.object3D.getWorldPosition(tmpTp);
        const dx=tmpTp.x-tmpPos.x, dz=tmpTp.z-tmpPos.z;
        const lx=dx*tmpRight.x+dz*tmpRight.z; const lz=dx*tmpFwd.x+dz*tmpFwd.z;
        const d=Math.hypot(lx,lz); if(d>RADAR_RANGE) continue;
        ctx.beginPath(); ctx.arc(cx-lx*s, cy+lz*s, Math.max(3,R*0.03), 0, Math.PI*2); ctx.fill();
      }
    }
    draw(popupTrigs,'#ff69b4'); // розовый — HUD
    draw(revealTrigs,'#ffd400'); // жёлтый — спавн узлов
    draw(planeTrigs, '#65d0ff'); // голубой — плейны
  }, INTERVAL);
})();

/* ========== дирижёр триггеров ========== */
AFRAME.registerComponent('trigger-director',{
  init(){
    whenModelReady(root=>{
      const scene=this.el.sceneEl;
      // скрываем, что появляется по триггерам
      ['dog','gyros','sunset2','sunset3','waves'].forEach(nm=>{ const n=findNodeByName(root,nm); if(n){ n.visible=false; } });

      const makeAtNode=(node, klass, comp, value)=>{
        const wp=new THREE.Vector3(); node.getWorldPosition(wp);
        const e=document.createElement('a-entity'); e.classList.add(klass);
        e.setAttribute('position',`${wp.x} ${wp.y} ${wp.z}`); if(comp) e.setAttribute(comp, value); scene.appendChild(e); return e;
      };

      const defLoops=1;
      // у cat на мобилке включим отдельный звук (audio:)
      const cat    =findNodeByName(root,'cat');     if(cat)    makeAtNode(cat,   'trigger-popup','popup-video-hud','radius:1.5; loops:'+defLoops+'; hysteresis:0.2; side:right; src:assets/video/clip1.mp4; audio:clip1');
      const pharma =findNodeByName(root,'pharma');  if(pharma) makeAtNode(pharma,'trigger-popup','popup-video-hud','radius:2.5; loops:'+defLoops+'; hysteresis:0.2; side:left;  src:assets/video/pharma.mp4');
      const petals =findNodeByName(root,'petals');  if(petals) makeAtNode(petals,'trigger-popup','popup-video-hud','radius:3.0; loops:'+defLoops+'; hysteresis:0.2; side:right; src:assets/video/petals.mp4');
      const tree   =findNodeByName(root,'tree');    if(tree)   makeAtNode(tree,  'trigger-popup','popup-video-hud','radius:3.0; loops:'+defLoops+'; hysteresis:0.2; side:left;  src:assets/video/tree.mp4');

      const taverna=findNodeByName(root,'taverna');
      if (taverna) makeAtNode(taverna,'trigger-reveal','reveal-node-rot-fade','targetName:gyros; radius:2.0; hysteresis:0.2; spinDegPerSec:60; lifeMs:15000; fadeMs:800; soundId:gyrosAudio');

      const attention=findNodeByName(root,'attention');
      if (attention) makeAtNode(attention,'trigger-reveal','attention-dog','radius:1.0; hysteresis:0.2; lifeMs:6000; fadeMs:600');

      ['sunset2','sunset3','waves'].forEach(name=>{
        const n=findNodeByName(root,name);
        if (n){ const e=makeAtNode(n,'trigger-plane', null, null);
          e.setAttribute('plane-video-once',`nodeName:${name}; videoSrc:assets/video/${name}.mp4; radius:2.5; hysteresis:0.1`);
        }
      });
    });
  }
});

AFRAME.registerComponent('path-movement', {
  schema: {
    path: {
      default: [
        { x: -16.632, y: 0, z: 4.002 },
        { x: -17.379, y: 0, z: -0.914 },
        { x: 15.093, y: 0, z: -4.741 },
        { x: 15.820, y: 0, z: -0.646 }
      ],
      parse: function (value) {
        if (typeof value === 'string') {
          return value.split(',').map(v => AFRAME.utils.coordinates.parse(v));
        }
        return value;
      }
    },
    speed: { type: 'number', default: 1 }
  },

  init: function () {
    this.waypoints = this.data.path.map(p => new THREE.Vector3(p.x, p.y, p.z));
    this.currentWaypointIndex = 0;
    this.targetWaypoint = this.waypoints[0];
    this.el.object3D.position.copy(this.targetWaypoint);
  },

  tick: function (time, timeDelta) {
    const currentPosition = this.el.object3D.position;
    const distanceToTarget = currentPosition.distanceTo(this.targetWaypoint);
    const moveDistance = this.data.speed * (timeDelta / 1000);

    if (moveDistance >= distanceToTarget) {
      currentPosition.copy(this.targetWaypoint);
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
      this.targetWaypoint = this.waypoints[this.currentWaypointIndex];
      this.el.object3D.lookAt(this.targetWaypoint);

      this.el.object3D.rotation.y -= Math.PI / 2;

    } else {
      const direction = this.targetWaypoint.clone().sub(currentPosition).normalize();
      this.el.object3D.position.add(direction.multiplyScalar(moveDistance));
    }
  }
});
