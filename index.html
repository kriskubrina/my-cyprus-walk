<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>My Cyprus Walk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
  <style>
    html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
    a-loading-screen{ display:none !important; }
    #mute{ position:fixed; left:12px; top:12px; padding:10px; background:#111; color:#fff; border-radius:8px; display:none; z-index:40; }
    #popup{ position:fixed; right:12px; top:220px; width:200px; aspect-ratio:1/1; display:none; z-index:35; }
    #popup video{ width:100%; height:100%; object-fit:cover; }
    #cueText{ position:fixed; left:50%; bottom:18%; transform:translateX(-50%); color:#fff; background:rgba(0,0,0,.4);
      font:14px system-ui; padding:6px 10px; border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:60; }
    #cueText.show{ opacity:.95; }
  </style>
</head>
<body>
<div id="cueText"></div>
<a-scene loading-screen="enabled:false" vr-mode-ui="enabled:false">
  <a-assets>
    <a-asset-item id="world" src="assets/models/limassol-walk.glb"></a-asset-item>
    <video id="planeVideoMobile" preload="metadata" playsinline webkit-playsinline style="display:none"></video>
    <audio id="amb" src="assets/audio/bg.mp3" preload="auto"></audio>
    <audio id="dogAudio" src="assets/audio/dog.mp3" preload="auto"></audio>
    <audio id="gyrosAudio" src="assets/audio/gyros.mp3" preload="auto"></audio>
  </a-assets>
  <a-entity id="rig">
    <a-entity id="player" camera position="0 1.6 0"></a-entity>
  </a-entity>
  <a-entity id="streetEntity" gltf-model="#world"></a-entity>
</a-scene>
<div id="popup"><video id="popupHud" playsinline webkit-playsinline preload="metadata"></video></div>
<button id="mute">🔇</button>
<script>
const isTouch = AFRAME.utils.device.isMobile();
const camEl=document.getElementById('player'); const rig=document.getElementById('rig'); const moverEl=isTouch?rig:camEl;
const popupWrap=document.getElementById('popup'); const popupHud=document.getElementById('popupHud');
const cue=document.getElementById('cueText'); const phrases=['oh, this spot','funny how it comes back','I was here, wasn’t I','feels familiar','I know this place','almost like a loop'];
function showCue(){ cue.textContent=phrases[(Math.random()*phrases.length)|0]; cue.classList.add('show'); }
function hideCue(){ cue.classList.remove('show'); }
let audioCtx=null; let ambGain=null, ambSource=null, ambBuffer=null, ambStarted=false, ambMuted=false;
async function loadAmb(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const res=await fetch(document.getElementById('amb').src); const arr=await res.arrayBuffer(); ambBuffer=await audioCtx.decodeAudioData(arr);
  ambGain=audioCtx.createGain(); ambGain.connect(audioCtx.destination); }
async function startAmb(){ if(ambStarted) return; if(!ambBuffer) await loadAmb();
  ambSource=audioCtx.createBufferSource(); ambSource.buffer=ambBuffer; ambSource.loop=true; ambSource.connect(ambGain); ambSource.start(0,9); ambStarted=true; }
document.getElementById('mute').onclick=()=>{ ambMuted=!ambMuted; ambGain.gain.value=ambMuted?0:1; };
async function chooseMobileFirst(videoEl, baseSrc){ const mobileSrc=baseSrc.replace(/\.mp4$/,'.mobile.mp4');
  if(isTouch){ try{ videoEl.src=mobileSrc; await videoEl.play(); return mobileSrc; }catch(_){ try{ videoEl.src=baseSrc; await videoEl.play(); return baseSrc; }catch(_){ return null; } } }
  else{ videoEl.src=baseSrc; return baseSrc; } }
AFRAME.registerComponent('trail-line',{schema:{},init(){this.points=[];this.line=null;},tick(t,dt){
  if(!this.line){const mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true});const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.BufferAttribute(new Float32Array(90),3));this.line=new THREE.Line(geom,mat);this.el.sceneEl.object3D.add(this.line);}
  if(!this.last||Date.now()-this.last>1000){const p=new THREE.Vector3();moverEl.object3D.getWorldPosition(p);this.points.push(p.clone());if(this.points.length>30)this.points.shift();
    const arr=this.line.geometry.attributes.position.array;for(let i=0;i<this.points.length;i++){arr[i*3]=this.points[i].x;arr[i*3+1]=0.02;arr[i*3+2]=this.points[i].z;}this.line.geometry.setDrawRange(0,this.points.length);this.line.geometry.attributes.position.needsUpdate=true;this.last=Date.now();}}});
moverEl.setAttribute('trail-line','');
</script>
</body>
</html>
